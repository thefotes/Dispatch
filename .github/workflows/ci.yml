name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test --parallel

      - name: Check version derivation
        run: scripts/test-version.sh

      - name: Install SwiftLint
        run: command -v swiftlint || brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict --no-cache --config .swiftlint.yml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache pinned TLA+ tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dispatch-build/tla2tools-1.7.4.jar
          key: tla2tools-${{ runner.os }}-1.7.4-936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88

      - name: Model-check TLA+ specs
        env:
          DISPATCH_BUILD_DIR: ${{ runner.temp }}/dispatch-build
        run: scripts/tla.sh
