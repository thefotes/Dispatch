name: Release

# Every push to main republishes the `latest` release, so the website's
# download button always points at the current build. Tagging `v*` cuts a
# permanent versioned release alongside it.
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# Signing degrades rather than failing. With the secrets below set, builds are
# Developer ID signed, notarized and stapled — no Gatekeeper warning, and the
# Input Monitoring grant survives updates because the signature is stable.
# Without them the build is ad-hoc signed and says so loudly in the release
# notes: macOS will refuse to open it until the user right-clicks → Open, and
# the permission grant resets on every update, because an ad-hoc signature
# changes every build.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#
#   MACOS_CERTIFICATE_P12   base64 of your "Developer ID Application" .p12
#                           export from Keychain Access, then:
#                           base64 -i cert.p12 | pbcopy
#   MACOS_CERTIFICATE_PASSWORD  the password you set on that .p12
#   MACOS_SIGN_IDENTITY     the identity's full name, e.g.
#                           "Developer ID Application: Your Name (TEAMID)"
#   NOTARY_KEY_P8           base64 of the App Store Connect API key .p8
#   NOTARY_KEY_ID           that key's Key ID
#   NOTARY_ISSUER_ID        the Issuer ID from App Store Connect
#
# An *Apple Development* certificate will not do: only Developer ID is
# accepted for distribution outside the App Store.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, publish
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      # Secrets cannot be tested in an `if:`, so decide here and let later
      # steps key off the output.
      - name: Decide how this build can be signed
        id: mode
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          if [[ -n "$CERT" && -n "$IDENTITY" && -n "$NOTARY_KEY" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Developer ID signing and notarization enabled."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not set — publishing an ad-hoc signed build. See the comment at the top of this workflow."
          fi

      - name: Import the signing certificate
        if: steps.mode.outputs.signed == 'true'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          # Ephemeral: the keychain and its password die with the runner.
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this, codesign blocks on a UI prompt that never comes.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

      # A tag is its own version; a main build gets the run number so the
      # bundle version still climbs between releases.
      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "WL_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "title=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "rolling=false" >> "$GITHUB_OUTPUT"
          else
            echo "WL_VERSION=0.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "title=Latest build (main)" >> "$GITHUB_OUTPUT"
            echo "rolling=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and sign
        env:
          WL_SIGN_IDENTITY: ${{ steps.mode.outputs.signed == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
        run: ./scripts/bundle.sh

      - name: Package
        run: ditto -c -k --keepParent build/MicroManager.app MicroManager.zip

      - name: Notarize
        if: steps.mode.outputs.signed == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit MicroManager.zip \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m
          rm -f "$RUNNER_TEMP/notary.p8"

      # The ticket is stapled to the .app, so the zip has to be rebuilt around
      # the stapled bundle. Shipping the pre-staple zip means every download
      # phones Apple on first launch, and fails when offline.
      - name: Staple and repackage
        if: steps.mode.outputs.signed == 'true'
        run: |
          xcrun stapler staple build/MicroManager.app
          xcrun stapler validate build/MicroManager.app
          rm -f MicroManager.zip
          ditto -c -k --keepParent build/MicroManager.app MicroManager.zip

      - name: Verify the signature
        run: |
          codesign --verify --deep --strict --verbose=2 build/MicroManager.app
          if [[ "${{ steps.mode.outputs.signed }}" == "true" ]]; then
            spctl --assess --type execute --verbose=2 build/MicroManager.app
          fi

      - name: Write the release notes
        id: notes
        run: |
          {
            if [[ "${{ steps.version.outputs.rolling }}" == "true" ]]; then
              echo "Built from \`main\` at [\`${GITHUB_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
              echo
              echo "This release is replaced on every push to main. For a build that stays put, use a tagged release."
            else
              echo "Version ${WL_VERSION}, from [\`${GITHUB_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
            fi
            echo
            if [[ "${{ steps.mode.outputs.signed }}" == "true" ]]; then
              echo "Developer ID signed, notarized and stapled — it opens normally, and the Input Monitoring grant survives updates."
            else
              echo "> **Ad-hoc signed.** The repository has no Developer ID secrets set, so macOS will refuse this build until you right-click the app and choose *Open*. The Input Monitoring grant is keyed to the code signature, and an ad-hoc one changes every build, so you will have to grant it again after each update."
            fi
            echo
            echo "Unzip, drag \`MicroManager.app\` to Applications, launch it, and grant Input Monitoring."
          } > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ steps.version.outputs.title }}
        run: |
          # Replace rather than edit: it keeps the tag on the commit that
          # actually produced the asset, which `gh release edit` will not do.
          if [[ "${{ steps.version.outputs.rolling }}" == "true" ]]; then
            gh release delete "$TAG" --cleanup-tag --yes || true
          fi
          gh release create "$TAG" MicroManager.zip \
            --title "$TITLE" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"

      - name: Clean up the keychain
        if: always() && steps.mode.outputs.signed == 'true'
        run: security delete-keychain "$KEYCHAIN" || true
