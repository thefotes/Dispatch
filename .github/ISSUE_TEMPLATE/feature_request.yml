name: Feature request
description: Suggest a Dispatch improvement
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need to do?
      description: Describe the workflow or limitation you are facing.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the result you would like and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant setup
      description: Include device, Herdr, or macOS details if they affect the request.
