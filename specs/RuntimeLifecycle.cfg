\* Safety: every invariant, across every interleaving within these bounds.
SPECIFICATION Spec

CONSTANTS
    Callers = {c1, c2}
    MaxCalls = 4
    MaxTasks = 8

\* Runs end once every caller is idle and the task budget is spent.
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    AtMostOneEventConsumer
    NoOrphanTasks
    HeldMatchesLifecycle
    OperationalIsTruthful
    StoppedStaysStopped
    AwaitingShowsConfigurationError
